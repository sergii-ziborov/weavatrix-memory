[package]
name = "weavatrix-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Event-sourced, bitemporal context compiler for coding agents"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/weavatrix-memory"
documentation = "https://docs.rs/weavatrix-memory"
readme = "README.md"
keywords = ["agents", "memory", "event-sourcing", "temporal", "context"]
categories = ["data-structures", "development-tools"]

[features]
default = []
json = ["dep:serde_json"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
weavatrix-graph = "0.5.0"

[dev-dependencies]
agentic-memory = { version = "0.4.2", default-features = false }
cqrs-es = "0.5.0"
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["rt"] }

[[bench]]
name = "replay"
harness = false

[[bench]]
name = "durable"
harness = false
required-features = ["json"]

[[bench]]
name = "event_store_competitors"
harness = false

[[bench]]
name = "memory_competitors"
harness = false

[[bench]]
name = "snapshot_codecs"
harness = false
required-features = ["json"]

[[bench]]
name = "extraction"
harness = false

[[bin]]
name = "weavatrix-memory-eval"
path = "tools/eval/main.rs"
required-features = ["json"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
